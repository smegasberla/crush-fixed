mit -m \"$(cat &lt;&lt;''EOF'' ... EOF)\". A failing hook gets one retry, then report\nit. Never change git config, push unless asked, or add a \"Generated with\" line or\nco-author trailer. Write for someone reading history without opening files:\n\"fix: prevent session loading from crashing on missing metadata\", not\n\"fix: nil pointer in session.go\".\n</git_commits>\n","parameters":{"properties":{"auto_background_after":{"description":"Seconds before it moves to the background (default 60)","type":"integer"},"command":{"description":"Command to run","type":"string"},"description":{"description":"What the command does, under 30 characters","type":"string"},"run_in_background":{"description":"Run in the background; read it later with job_output.","type":"boolean"},"working_dir":{"description":"Directory to run in (default: the working directory)","type":"string"}},"required":["description","command"],"type":"object"}},"type":"function"},{"function":{"name":"download","strict":false,"description":"Download a URL directly to a local file (binary-safe, streaming, max 600s timeout); overwrites without warning. For reading content into context use fetch.\n","parameters":{"properties":{"file_path":{"description":"Where to save it; overwritten without warning","type":"string"},"timeout":{"description":"Seconds (max 600)","type":"integer"},"url":{"description":"URL to download","type":"string"}},"required":["url","file_path"],"type":"object"}},"type":"function"},{"function":{"name":"edit","strict":false,"description":"Find-and-replace within a file; can also create or delete content. A match that\ndiffers only in whitespace still edits, with new_string re-indented, and the\nresponse says so. Prefer `lsp_replace_symbol` for whole functions and\n`lsp_rename` for renames; use write for large rewrites.\n","parameters":{"properties":{"delete":{"description":"Remove the addressed region.","type":"boolean"},"end_line":{"description":"Inclusive end of that region. Defaults to line.","type":"integer"},"expect":{"description":"Text that must sit at that line, proving it is not stale.","type":"string"},"file_path":{"description":"Absolute path of the file to modify","type":"string"},"line":{"description":"1-based line to address, for text that cannot be quoted. Requires expect.","type":"integer"},"new_string":{"description":"Replacement text","type":"string"},"old_string":{"description":"Text to replace","type":"string"},"ops":{"description":"Several regions of this file in one transaction; nothing is written if any fails.","items":{"properties":{"delete":{"description":"Remove the region.","type":"boolean"},"end_line":{"description":"Inclusive end of the region.","type":"integer"},"expect":{"description":"Text that must sit at that line.","type":"string"},"id":{"description":"Short name for this op, for refusal messages.","type":"string"},"line":{"description":"1-based line to address.","type":"integer"},"new_string":{"description":"Replacement text.","type":"string"},"old_string":{"description":"Text to replace.","type":"string"},"replace_all":{"description":"Replace every occurrence.","type":"boolean"}},"type":"object"},"type":"array"},"replace_all":{"description":"Replace every occurrence, not just the first.","type":"boolean"}},"required":["file_path"],"type":"object"}},"type":"function"},{"function":{"name":"multiedit","strict":false,"description":"Apply multiple find-and-replace edits to a single file in one operation; edits run sequentially. Prefer over edit for multiple changes to the same file. Same exact-match rules as edit apply.","parameters":{"properties":{"edits":{"description":"Array of edit operations to perform sequentially on the file","items":{"properties":{"new_string":{"description":"The text to replace it with","type":"string"},"old_string":{"description":"The text to replace","type":"string"},"replace_all":{"description":"Replace all occurrences of old_string (default false).","type":"boolean"}},"required":["old_string