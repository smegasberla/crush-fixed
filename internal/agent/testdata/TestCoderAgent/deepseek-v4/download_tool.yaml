aping regex characters.","type":"boolean"},"path":{"description":"Directory to search (default: working directory)","type":"string"},"pattern":{"description":"Regex to search file contents","type":"string"}},"required":["pattern"],"type":"object"}},"type":"function"},{"function":{"name":"ls","strict":false,"description":"List files and directories as a tree; skips hidden files and common system dirs; max 1000 files. Use glob to find files by pattern, grep to search contents.\n","parameters":{"properties":{"depth":{"description":"How deep to traverse","type":"integer"},"ignore":{"description":"Glob patterns to ignore","items":{"type":"string"},"type":"array"},"path":{"description":"Directory to list (default: working directory)","type":"string"}},"required":[],"type":"object"}},"type":"function"},{"function":{"name":"sourcegraph","strict":false,"description":"Search code across public GitHub repositories via Sourcegraph; supports regex, language/repo/file filters, and symbol search (max 20 results). Only searches public repos.\n","parameters":{"properties":{"context_window":{"description":"Lines around each match (default 10)","type":"integer"},"count":{"description":"Results to return (default 10, max 20)","type":"integer"},"query":{"description":"Search query","type":"string"},"timeout":{"description":"Seconds (max 120)","type":"integer"}},"required":["query"],"type":"object"}},"type":"function"},{"function":{"name":"view","strict":false,"description":"Read a file by path with line numbers; supports offset and line limit (default 200, max 200KB returned file content section); renders images (PNG, JPEG, GIF, WebP); use ls for directories.\n","parameters":{"properties":{"around":{"description":"1-based line to centre on, for a search result.","type":"integer"},"context":{"description":"Lines of context each side of around (default 40).","type":"integer"},"file_path":{"description":"Path of the file to read","type":"string"},"files":{"description":"Several files in on