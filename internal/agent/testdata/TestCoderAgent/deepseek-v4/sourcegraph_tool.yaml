"format"],"type":"object"}},"type":"function"},{"function":{"name":"glob","strict":false,"description":"Find files by name/pattern (glob syntax), sorted by modification time; max 100 results; skips hidden files. Use grep to search file contents.\n","parameters":{"properties":{"path":{"description":"Directory to search (default: working directory)","type":"string"},"pattern":{"description":"Glob to match file names","type":"string"}},"required":["pattern"],"type":"object"}},"type":"function"},{"function":{"name":"grep","strict":false,"description":"Search file contents by regex or literal text; returns matching file paths sorted by modification time (max 100); respects .gitignore. Use glob to filter by filename, not contents.\n","parameters":{"properties":{"include":{"description":"File pattern to include, e.g. \"*.js\", \"*.{ts,tsx}\"","type":"string"},"literal_text":{"description":"Treat the pattern as literal text, escaping regex characters.","type":"boolean"},"path":{"description":"Directory to search (default: working directory)","type":"string"},"pattern":{"description":"Regex to search file contents","type":"string"}},"required":["pattern"],"type":"object"}},"type":"function"},{"function":{"name":"ls","strict":false,"description":"List files and directories as a tree; skips hidden files and common system dirs; max 1000 files. Use glob to find files by pattern, grep to search contents.\n","parameters":{"properties":{"depth":{"description":"How deep to traverse","type":"integer"},"ignore":{"description":"Glob patterns to ignore","items":{"type":"string"},"type":"array"},"path":{"description":"Directory to list (default: working directory)","type":"string"}},"required":[],"type":"object"}},"type":"function"},{"function":{"name":"sourcegraph","strict":false,"description":"Search code across public GitHub repositories via Sourcegraph; supports regex, language/repo/file filters, and symbol search (max 20 results). Only searches public repos.\n","parameters":{"proper